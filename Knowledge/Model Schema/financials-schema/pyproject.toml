[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financials-schema"
version = "0.1.0"
description = "Pydantic contracts for the financials-pipeline skills"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["financials_schema"]
